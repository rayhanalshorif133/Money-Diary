    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css" />

    <div class="investment-card">

        <table border="1" width="100%" cellspacing="0" cellpadding="8">
            <thead>
                <tr>
                    <th>Date</th>

                    <th>Extra Investment ($)</th>
